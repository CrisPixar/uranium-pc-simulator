name: Build Uranium PC Simulator

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Build APK (apktool b)
        run: |
          java -jar /tmp/apktool.jar b . -o UraniumPCSimulator-unsigned.apk

      - name: Проверка содержимого APK (хэши и сигнатуры патчей)
        run: |
          python3 - <<'PYEOF'
          import zipfile, hashlib, sys
          z = zipfile.ZipFile('UraniumPCSimulator-unsigned.apk')
          def h(b): return hashlib.sha256(b).hexdigest()[:16]
          ok = True
          def chk(cond, msg):
              global ok
              print(('OK   ' if cond else 'FAIL ') + msg)
              ok = ok and bool(cond)

          for ap in ('assets/bin/Data/data.unity3d',
                     'assets/bin/Data/sharedassets0.resource',
                     'lib/arm64-v8a/libil2cpp.so',
                     'lib/armeabi-v7a/libil2cpp.so',
                     'classes.dex'):
              chk(h(z.read(ap)) == h(open(ap, 'rb').read()), ap)

          mf = z.read('AndroidManifest.xml')
          chk('com.UraniumPCS.UraniumPCSimulator'.encode('utf-16-le') in mf, 'пакет')
          chk(b'Uranium PC Simulator' in z.read('resources.arsc'), 'app_name')

          # --- v3: рантайм-литерал заголовка в global-metadata.dat ---
          gm = z.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
          lit = b'<color=cyan>Uranium</color> <color=red>PC</color> Simulator'
          chk(gm[0x1E4A1:0x1E4A1+59] == lit and b'<color=orange>PC</color>' not in gm,
              'v3 литерал заголовка (metadata)')

          so64 = z.read('lib/arm64-v8a/libil2cpp.so')
          so32 = z.read('lib/armeabi-v7a/libil2cpp.so')

          # --- v3/v4/v7/b10: всё, что было и осталось ---
          chk(so64[0x829668:0x829668+4] == bytes.fromhex('d4d00014'), 'v3 arm64 BTC-кейв')
          chk(so32[0x53bad0:0x53bad0+4] == bytes.fromhex('6ab95cea'), 'v3 arm32 BTC-кейв')
          chk(so64[0x867394:0x867394+4] == bytes.fromhex('210340f9'), 'v7 arm64 B2 = оригинал')
          chk(so32[0x58b9b4:0x58b9b4+4] == bytes.fromhex('000097e5'), 'v7 arm32 B2 = оригинал')
          chk(so64[0x8674dc:0x8674dc+4] == bytes.fromhex('60003fd6'), 'v4 arm64 фикс краша (blr)')
          chk(so64[0x834ef4:0x834ef4+4] == bytes.fromhex('fba20014'), 'v4 arm64 Supports-кейв')
          chk(so32[0x54aba8:0x54aba8+4] == bytes.fromhex('747d5cea'), 'v4 arm32 Supports-кейв')
          chk(so64[0x8671f8:0x8671f8+4] != bytes.fromhex('50daff17'), 'arm64 без file-хука')
          chk(so32[0x58b7ec:0x58b7ec+4] == bytes.fromhex('05508fe0'), 'arm32 без file-хука')
          chk(so64[0x867540:0x867540+4] == bytes.fromhex('f2ffff17'), 'v4 arm64 не-хватает-денег')
          chk(so32[0x58bb48:0x58bb48+4] == bytes.fromhex('1c0094e5'), 'v4 arm32 неверный-размер')
          chk(so64[0x867384:0x867384+4] == bytes.fromhex('1fdaff17'), 'v7 arm64 cave2')
          chk(so64[0x85dae0+56:0x85dae0+60] == bytes.fromhex('0a791f53'), 'v7 arm64 sup-обратные')
          chk(so32[0x58b9b8:0x58b9bc] == bytes.fromhex('307a5bea'), 'v7 arm32 cave2')
          chk(so32[0x1c6a180+0x3c:0x1c6a180+0x40] == bytes.fromhex('8120a0e1'), 'v7 arm32 sup-обратные')
          chk(so64[0x85da14:0x85da18] == bytes.fromhex('68000034'), 'b10 money64 cbz->pop')
          chk(so64[0x85da20:0x85da24] == bytes.fromhex('fe0741f8'), 'b10 money64 pop+ret')

          # --- b11: НГ-хуки (Start/EventSystem/Refresh) ---
          chk(so64[0x7e415c:0x7e4164] == bytes.fromhex('b1e601141f2003d5'), 'b11 Start64 -> ny')
          chk(so64[0x199acd0:0x199acd8] == bytes.fromhex('1c0cbb171f2003d5'), 'b11 ES64 -> es')
          chk(so64[0x81b7f0:0x81b7f8] == bytes.fromhex('540a01141f2003d5'), 'b11 Refresh64 -> rf')
          chk(so32[0x4e012c:0x4e0134] == bytes.fromhex('59285eea00f020e3'), 'b11 Start32 -> ny')
          chk(so32[0x528af8:0x528b00] == bytes.fromhex('97155dea00f020e3'), 'b11 Refresh32 -> rf')
          chk(all(s in so64 and s in so32 for s in
                  (b'UraniumEggClicks', b'UraniumEggUses', b'bitcoin_searcher',
                   b'UraniumGift', b'UraniumNY', b'UraniumCH', b'Snow',
                   b'UraniumCHFlag', b'UraniumEggFlag')),
              'b13 строки кейвов (включая флажки кнопок)')
          chk(so64[0x85dde4:0x85dde8] == bytes.fromhex('99c73d94'), 'b12 Start64 GO.get_transform')
          chk(so32[0x1c80a38:0x1c80a3c] == bytes.fromhex('57f0efeb'), 'b12 Start32 GO.get_transform')

          # --- b13: ГЛАВНОЕ — хук LoadScene снят (мир/сохранения грузятся) ---
          chk(so64[0x7e50f8:0x7e5100] == bytes.fromhex('f60f1df8f55301a9'),
              'b13 arm64 LoadScene: оригинальный пролог (хук снят)')
          chk(so64[0x85e0e0:0x85e140] == b'\x00' * 0x60,
              'b13 arm64 кейв ls64 обнулён')
          # --- b13: пасхалка на заголовке меню ---
          chk(so64[0x85de44:0x85de4c] == bytes.fromhex('000000b000400c91'),
              'b13 arm64 пасхалка на заголовке')
          chk(so32[0x1c80a8c:0x1c80a94] == bytes.fromhex('fc019fe500008fe0'),
              'b13 arm32 пасхалка на заголовке')
          chk(so64[0x85dec4:0x85dec8] == bytes.fromhex('21e28452'),
              'b13 arm64 Random.Range(100,10001)')
          # --- b13: кнопка CH ---
          chk(so64[0x85e180:0x85e188] == bytes.fromhex('0000009000000c91'), 'b13 arm64 кейв CH')
          chk(so32[0x1c80d00:0x1c80d08] == bytes.fromhex('d8009fe500008fe0'), 'b13 arm32 кейв CH')
          chk(so64[0x85dc44:0x85dc48] == bytes.fromhex('97010014'), 'b13 arm64 ny64 -> 3 состояния CH')
          chk(so32[0x1c6a2cc:0x1c6a2d0] == bytes.fromhex('390000ea'), 'b13 arm32 ny32 -> 3 состояния CH')

          # --- b13: бандл (кнопка CH на экране + НГ-музыка) и ресурс ---
          want = open('mod/bundle_b13.sha256').read().strip()
          chk(hashlib.sha256(z.read('assets/bin/Data/data.unity3d')).hexdigest() == want,
              'bundle b13 (CH_Btn виден, AudioSource на Snow)')
          wantr = open('mod/resource_b13.sha256').read().strip()
          res = z.read('assets/bin/Data/sharedassets0.resource')
          chk(hashlib.sha256(res).hexdigest() == wantr, 'sharedassets0.resource (НГ-музыка)')
          chk(res[6496:6500] == b'FSB5' and len(res) == 7816640, 'FSB5 с НГ-музыкой на месте')
          zi = z.getinfo('assets/bin/Data/sharedassets0.resource')
          chk(zi.compress_type == zipfile.ZIP_STORED, 'sharedassets0.resource не сжат в APK')

          print('записей в APK:', len(z.namelist()))
          sys.exit(0 if ok else 1)
          PYEOF

      - name: ZipAlign + Sign (apksigner, v1+v2+v3)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          test -n "$KEYSTORE_BASE64" || { echo "нет секрета KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > uranium.jks
          "$BT/zipalign" -f -p 4 UraniumPCSimulator-unsigned.apk UraniumPCSimulator-aligned.apk
          "$BT/apksigner" sign \
            --ks uranium.jks \
            --ks-key-alias uranium \
            --ks-pass pass:$KEYSTORE_PASSWORD \
            --key-pass pass:$KEYSTORE_PASSWORD \
            --out UraniumPCSimulator.apk \
            UraniumPCSimulator-aligned.apk
          "$BT/apksigner" verify --print-certs UraniumPCSimulator.apk || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UraniumPCSimulator
          path: UraniumPCSimulator.apk
          retention-days: 90

      - name: Create release (новый тег на каждую сборку)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.9.1.11-uranium.b13"
          DATE=$(date +'%Y.%m.%d-%H%M')
          NOTES="Мод Blue PC Simulator: Uranium PC Simulator. Сборка $DATE.

          Изменения b13:
          - ИСПРАВЛЕНО: НЕ ГРУЗИЛСЯ МИР И СОХРАНЕНИЯ, ИГРА ЗАМИРАЛА. Виноват был хук MainMenu.LoadScene из b11: при индексе сцены < 1 он вызывал PlayerPrefs и затирал сам аргумент — Unity получал мусорный номер сцены (\"Scene with build index: 1543503875 couldn't be loaded\"), корутина LoadAsync падала в NullReferenceException и экран загрузки повисал. На этот же хук была повешена кнопка CH, поэтому одно её нажатие ломало меню до перезапуска. Хук снят полностью, загрузка сцен теперь ровно как в оригинале
          - ИСПРАВЛЕНО: КНОПКИ CH НЕ БЫЛО ВИДНО. Её клонировали с кнопки Return, у которой якорь в правом нижнем углу, и сместили на +160 по X — кнопка уезжала за край экрана. Теперь CH стоит в левом нижнем углу настроек (зеркало Return) и подписана \"CH\"
          - ИСПРАВЛЕНО: CH НЕ РАБОТАЛА С 25 ДЕКАБРЯ ПО 10 ЯНВАРЯ. Раньше CH умела только \"включить НГ\", а в сезон он и так включён. Теперь UraniumCH — три состояния: 0 авто (сезон 25.12-10.01 или шанс 1%), 1 всегда НГ, 2 никогда НГ. Кнопка переключает НГ-режим в обе стороны в любой день года, снег и музыка появляются/пропадают СРАЗУ, без перезагрузки сцены
          - НОВОГОДНЯЯ МУЗЫКА В МЕНЮ (файл от автора мода): играет зациклено, когда включён НГ-режим, и глушится кнопкой CH
          - ПАСХАЛКА BITCOIN SEARCHER ПЕРЕЕХАЛА: теперь 10 кликов по надписи \"Uranium PC Simulator\" в главном меню дают случайно 100-10000 BTC (было 100-1000 по строке Print Master в ачивках). Работает максимум 2 раза, достижение Bitcoin Searcher выдаётся с первого раза

          Всё из b12 сохранено: анимации меню (пульс заголовка, дыхание Start), НГ-снег в меню и комнатах, НГ-подарки на кондиционерах, печать на защитное стекло CPU, бесплатные покупки в песочнице, принтер 128x128 (печатает 16..1024), маркет 53 товара, горизонтальный баннер на сайте PrintExpert, краски x3, точная печать без искажения цветов."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" UraniumPCSimulator.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" UraniumPCSimulator.apk --repo "$GITHUB_REPOSITORY" \
              --title "Uranium PC Simulator $TAG" --notes "$NOTES" --prerelease=false
          fi
