name: Build Uranium PC Simulator

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Build APK (apktool b)
        run: |
          java -jar /tmp/apktool.jar b . -o UraniumPCSimulator-unsigned.apk

      - name: Проверка содержимого APK (хэши и манифест)
        run: |
          python3 - <<'PYEOF'
          import zipfile, hashlib, sys
          z = zipfile.ZipFile('UraniumPCSimulator-unsigned.apk')
          def h(b): return hashlib.sha256(b).hexdigest()[:16]
          ok = True
          for ap, sp in [
              ('assets/bin/Data/data.unity3d', 'assets/bin/Data/data.unity3d'),
              ('lib/arm64-v8a/libil2cpp.so', 'lib/arm64-v8a/libil2cpp.so'),
              ('lib/armeabi-v7a/libil2cpp.so', 'lib/armeabi-v7a/libil2cpp.so'),
              ('classes.dex', 'classes.dex'),
          ]:
              a, b = h(z.read(ap)), h(open(sp, 'rb').read())
              print(('OK  ' if a == b else 'FAIL'), ap)
              ok = ok and a == b
          mf = z.read('AndroidManifest.xml')
          pkg = 'com.UraniumPCS.UraniumPCSimulator'.encode('utf-16-le') in mf
          print('OK   пакет' if pkg else 'FAIL пакет'); ok = ok and pkg
          name = b'Uranium PC Simulator' in z.read('resources.arsc')
          print('OK   app_name' if name else 'FAIL app_name'); ok = ok and name
          # --- v3: рантайм-литерал заголовка в global-metadata.dat ---
          gm = z.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
          lit = b'<color=cyan>Uranium</color> <color=red>PC</color> Simulator'
          c1 = gm[0x1E4A1:0x1E4A1+59] == lit and b'<color=orange>PC</color>' not in gm
          print('OK   v3 литерал заголовка (metadata)' if c1 else 'FAIL v3 литерал'); ok = ok and c1
          # --- v3: сигнатуры нативных патчей ---
          so64 = z.read('lib/arm64-v8a/libil2cpp.so')
          so32 = z.read('lib/armeabi-v7a/libil2cpp.so')
          c2 = so64[0x829668:0x829668+4] == bytes.fromhex('d4d00014')   # b 0x85d9b8 (BTC-кейв)
          print('OK   v3 arm64 BTC-кейв' if c2 else 'FAIL v3 arm64 BTC-кейв'); ok = ok and c2
          c3 = so32[0x53bad0:0x53bad0+4] == bytes.fromhex('6ab95cea')   # b 0x1c6a080 (BTC-кейв)
          print('OK   v3 arm32 BTC-кейв' if c3 else 'FAIL v3 arm32 BTC-кейв'); ok = ok and c3
          c4 = so64[0x867394:0x867394+4] == bytes.fromhex('3701261e')   # fmov w23, s9 (спавн)
          print('OK   v3 arm64 спавн-блок' if c4 else 'FAIL v3 arm64 спавн-блок'); ok = ok and c4
          c5 = so32[0x58b9b4:0x58b9b4+4] == bytes.fromhex('100a18ee')   # vmov r0, s16 (спавн)
          print('OK   v3 arm32 спавн-блок' if c5 else 'FAIL v3 arm32 спавн-блок'); ok = ok and c5
          print('записей в APK:', len(z.namelist()))
          sys.exit(0 if ok else 1)
          PYEOF

      - name: ZipAlign + Sign (apksigner, v1+v2+v3)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -f -p 4 UraniumPCSimulator-unsigned.apk UraniumPCSimulator-aligned.apk
          "$BT/apksigner" sign \
            --ks uranium.jks \
            --ks-key-alias uranium \
            --ks-pass pass:***REMOVED-KEYSTORE-PASS*** \
            --key-pass pass:***REMOVED-KEYSTORE-PASS*** \
            --out UraniumPCSimulator.apk \
            UraniumPCSimulator-aligned.apk
          "$BT/apksigner" verify --print-certs UraniumPCSimulator.apk || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UraniumPCSimulator
          path: UraniumPCSimulator.apk
          retention-days: 90

      - name: Create release (новый тег на каждую сборку)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.9.1.11-uranium.b${GITHUB_RUN_NUMBER}"
          DATE=$(date +'%Y.%m.%d-%H%M')
          NOTES="Мод Blue PC Simulator: Uranium PC Simulator. Сборка $DATE.

          Изменения v3:
          - Заголовок меню больше не возвращается к 'Blue' (патч рантайм-литерала)
          - Принтеры 512/1024 и горизонтальный баннер видны и покупаются в маркете (фикс карточки 'Title')
          - Горизонтальный баннер заказывается на сайте PrintExpert: картинка 70x32 (вертикальный баннер - 32x70, как раньше)
          - Исправлен двойной спавн баннера при покупке на сайте (лишний белый баннер)
          - Сетка между пикселями и RGB-субпиксели на голограммах вблизи убраны (текстура rgb -> белая)
          - В режиме песочницы ВСЕ покупки бесплатны (монеты не списываются, BTC-разблокировки не списывают BTC)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" UraniumPCSimulator.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" UraniumPCSimulator.apk --repo "$GITHUB_REPOSITORY" \
              --title "Uranium PC Simulator $TAG" --notes "$NOTES" --prerelease=false
          fi
